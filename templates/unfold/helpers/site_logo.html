{% load i18n %}

<a href="{% url 'admin:orders_order_changelist' %}" x-on:click.stop>
    {% if site_logo.light and site_logo.dark %}
        <img src="{{ site_logo.dark }}" alt="{% trans 'Bestellungen' %}" class="h-8 hidden mr-4 dark:block"/>

        <img src="{{ site_logo.light }}" alt="{% trans 'Bestellungen' %}" class="block h-8 mr-4 dark:hidden" />
    {% else %}
        <img src="{{ site_logo }}" class="h-8 mr-4" alt="{% trans 'Bestellungen' %}" />
    {% endif %}
</a>

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    charset utf-8;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gc_bridge_web http://web:8000;

    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
    }

    # Keep this response outside Django so it remains available while the web
    # container is recreated during a deployment.
    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
    }

    location / {
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
        proxy_pass $gc_bridge_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
